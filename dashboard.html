<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSCN Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Quick working dashboard styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        
        .header {
            background: #1a3c6e;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { font-size: 20px; }
        .header .user { display: flex; align-items: center; gap: 12px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card .label { color: #666; font-size: 13px; }
        .stat-card .value { font-size: 24px; font-weight: 700; color: #1a3c6e; margin-top: 4px; }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .card h3 { margin-bottom: 16px; color: #1a3c6e; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th { background: #f8f9fa; font-weight: 600; color: #333; }
        
        .btn {
            padding: 8px 16px;
            background: #1a3c6e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn:hover { background: #0f284a; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        
        .text-center { text-align: center; }
        .text-muted { color: #666; }
        .mt-2 { margin-top: 16px; }
        
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-paid { background: #d4edda; color: #155724; }
        .badge-pending { background: #f8d7da; color: #721c24; }
        .badge-partial { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-receipt"></i> VSCN Billing</h1>
        <div class="user">
            <span id="userName">Loading...</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    
    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Customers</div>
                <div class="value" id="totalCustomers">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Today's Collection</div>
                <div class="value" id="todayCollection">₹0</div>
            </div>
            <div class="stat-card">
                <div class="label">This Month</div>
                <div class="value" id="monthCollection">₹0</div>
            </div>
            <div class="stat-card">
                <div class="label">Pending</div>
                <div class="value" id="pendingCount">0</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="card">
            <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn btn-success" onclick="showPayment()"><i class="fas fa-hand-holding-usd"></i> New Payment</button>
                <button class="btn" onclick="showCustomers()"><i class="fas fa-users"></i> Customers</button>
                <button class="btn" onclick="showReports()"><i class="fas fa-chart-bar"></i> Reports</button>
            </div>
        </div>
        
        <!-- Recent Payments -->
        <div class="card">
            <h3><i class="fas fa-history"></i> Recent Payments</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Receipt</th>
                            <th>Customer</th>
                            <th>Code</th>
                            <th>Month</th>
                            <th>Amount</th>
                            <th>Mode</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentPayments">
                        <tr>
                            <td colspan="7" class="text-center text-muted">
                                <div class="loading-spinner">Loading...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const userData = localStorage.getItem('vscn_user');
        if (!userData) {
            window.location.href = 'index.html';
        }
        
        const user = JSON.parse(userData);
        document.getElementById('userName').textContent = user.name || 'User';
        
        // API Configuration
        const API_BASE = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
        
        // Load dashboard data
        async function loadDashboard() {
            try {
                // Simulate loading data
                const stats = {
                    totalCustomers: 125,
                    todayCollection: 12450,
                    monthCollection: 234560,
                    pendingCount: 32
                };
                
                document.getElementById('totalCustomers').textContent = stats.totalCustomers;
                document.getElementById('todayCollection').textContent = `₹${stats.todayCollection.toFixed(2)}`;
                document.getElementById('monthCollection').textContent = `₹${stats.monthCollection.toFixed(2)}`;
                document.getElementById('pendingCount').textContent = stats.pendingCount;
                
                // Load recent payments
                const payments = [
                    { receipt: 'VSCN-001', customer: 'Rajesh Kumar', code: 'VSCN001', month: 'March', amount: 1500, mode: 'CASH', date: '2026-07-27' },
                    { receipt: 'VSCN-002', customer: 'Priya Sharma', code: 'VSCN002', month: 'April', amount: 2000, mode: 'UPI', date: '2026-07-27' },
                    { receipt: 'VSCN-003', customer: 'Amit Singh', code: 'VSCN003', month: 'March', amount: 1500, mode: 'CASH', date: '2026-07-26' },
                ];
                
                const tbody = document.getElementById('recentPayments');
                if (payments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No recent payments</td></tr>';
                } else {
                    tbody.innerHTML = payments.map(p => `
                        <tr>
                            <td><strong>${p.receipt}</strong></td>
                            <td>${p.customer}</td>
                            <td><span class="badge badge-paid">${p.code}</span></td>
                            <td>${p.month}</td>
                            <td><strong>₹${p.amount}</strong></td>
                            <td><span class="badge badge-paid">${p.mode}</span></td>
                            <td>${p.date}</td>
                        </tr>
                    `).join('');
                }
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showToast('Error loading data', 'error');
            }
        }
        
        function showToast(message, type = 'info') {
            alert(message);
        }
        
        function showPayment() {
            alert('Payment page - coming soon!');
        }
        
        function showCustomers() {
            alert('Customers page - coming soon!');
        }
        
        function showReports() {
            alert('Reports page - coming soon!');
        }
        
        function logout() {
            localStorage.removeItem('vscn_user');
            window.location.href = 'index.html';
        }
        
        // Load dashboard on page load
        loadDashboard();
        <!-- Add sync status and button -->
<div class="sync-bar" style="display:flex;align-items:center;gap:12px;padding:8px 16px;background:#f8f9fa;border-bottom:1px solid #eee;">
    <i class="fas fa-sync-alt"></i>
    <span id="syncStatus">Ready</span>
    <span style="font-size:12px;color:#666;" id="lastSyncTime">
        Last sync: ${lastSyncTime || 'Never'}
    </span>
    <button onclick="manualSync()" class="btn-sm btn-primary" style="margin-left:auto;">
        <i class="fas fa-sync-alt"></i> Sync Now
    </button>
</div>

<!-- Scripts -->
<script src="js/sync.js">
    </script>
</body>
</html>
