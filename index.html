<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSCN Billing System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Minimal working styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .login-container h1 {
            color: #1a3c6e;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1a3c6e;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #1a3c6e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #0f284a;
        }
        
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }
        
        .logo {
            text-align: center;
            font-size: 48px;
            color: #1a3c6e;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-receipt"></i>
        </div>
        <h1>VSCN Billing</h1>
        <p>Sign in to access your dashboard</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required value="admin">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required value="admin123">
            </div>
            
            <button type="submit" class="btn">Sign In</button>
            <div id="errorMessage" class="error"></div>
        </form>
        
        <div style="margin-top: 16px; text-align: center; font-size: 12px; color: #999;">
            <p>Demo Credentials: admin / admin123</p>
        </div>
    </div>

    <script>
        // Simple login handler
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // Demo users
            const users = {
                'admin': 'admin123',
                'collector': 'collector123'
            };
            
            if (users[username] && users[username] === password) {
                // Store login state
                localStorage.setItem('vscn_user', JSON.stringify({
                    username: username,
                    name: username === 'admin' ? 'Administrator' : 'Collector',
                    role: username === 'admin' ? 'ADMIN' : 'COLLECTOR'
                }));
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
                errorDiv.textContent = '';
            } else {
                errorDiv.textContent = 'Invalid username or password';
            }
        }
    </script>
</body>
</html>
